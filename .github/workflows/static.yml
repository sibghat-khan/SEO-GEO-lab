name: Publish The Search Lab
on:
  push:
    branches: ["main"]
    paths: ["the-search-lab-website.zip", ".github/workflows/static.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract portfolio
        run: |
          mkdir -p public
          unzip -q the-search-lab-website.zip -d public
          test -f public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
